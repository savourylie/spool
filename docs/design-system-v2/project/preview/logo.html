<!doctype html>
<html><head><meta charset="utf-8"><title>Logo & wordmark</title>
<link rel="stylesheet" href="_shared.css">
</head>
<body>
<div class="card-wrap">
  <div class="row" style="gap:32px;align-items:center">
    <!-- Wordmark with yellow circle accent -->
    <div style="position:relative;display:inline-block;padding:12px 4px 4px 4px">
      <span style="position:absolute;top:-4px;left:-12px;width:72px;height:72px;border-radius:9999px;background:rgba(251,191,36,0.65);z-index:-1"></span>
      <span style="font-family:var(--font-heading);font-weight:800;font-size:64px;color:var(--foreground);letter-spacing:-0.02em">Spool</span>
    </div>
    <div class="col" style="gap:8px">
      <div class="lbl">Tagline</div>
      <p style="max-width:320px;font-size:14px;color:var(--muted-foreground);margin:0">Analytics that understand the algorithm. See what's working, when to post, and who's listening.</p>
    </div>
  </div>
  <div class="row" style="gap:18px;align-items:center">
    <span style="font-family:var(--font-heading);font-weight:800;font-size:22px;color:var(--accent)">Spool</span>
    <span style="font-family:var(--font-heading);font-weight:800;font-size:18px;color:var(--foreground)">Spool</span>
    <span style="font-family:var(--font-heading);font-weight:800;font-size:18px;color:white;background:#1E293B;padding:4px 10px;border-radius:9999px">Spool</span>
    <span style="font-family:ui-monospace,monospace;font-size:11px;color:var(--muted-foreground)">Wordmark only — no separate logomark in product.</span>
  </div>
</div>
</body></html>
