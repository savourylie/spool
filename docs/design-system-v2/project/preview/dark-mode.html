<!doctype html>
<html data-theme="dark"><head><meta charset="utf-8"><title>Dark mode</title>
<link rel="stylesheet" href="_shared.css">
<style>
  .panel { background: var(--card); border: 2px solid var(--foreground); border-radius: var(--radius-lg); padding: 20px; box-shadow: var(--shadow-soft); }
  .pill { display:inline-flex; align-items:center; gap:6px; padding:4px 12px; border-radius:9999px; font-size:12px; font-weight:700; border:1.5px solid; }
</style>
</head>
<body style="background: var(--background); padding: 16px;">
<div class="card-wrap">
  <div class="row" style="gap:12px; align-items:stretch">
    <div class="panel" style="flex:1.4">
      <span class="lbl">Today · stat card</span>
      <div style="font-family: var(--font-heading); font-weight: 800; font-size: 36px; color: var(--foreground); margin-top: 6px">2,112</div>
      <div style="font-size: 12px; color: var(--muted-foreground)">+128 followers this week</div>
    </div>
    <div class="panel featured" style="flex:1; box-shadow: var(--shadow-featured)">
      <span class="lbl">Featured card</span>
      <p style="margin-top:8px; color: var(--foreground); font-size: 13px">Your viral post — pink hard shadow translates straight across.</p>
    </div>
    <div style="flex:0.7;display:flex;flex-direction:column;gap:8px">
      <button class="btn">Generate</button>
      <button class="btn outline">Refresh</button>
      <button class="btn ghost">Settings</button>
    </div>
  </div>
  <div class="row" style="gap:10px">
    <span class="pill" style="background:rgba(167,139,250,0.20); color:#A78BFA; border-color:rgba(167,139,250,0.5)">Usable · 14 posts</span>
    <span class="pill" style="background:rgba(110,231,183,0.20); color:#6EE7B7; border-color:rgba(110,231,183,0.5)">Score 84 · Great</span>
    <span class="pill" style="background:rgba(251,191,36,0.20); color:#FBBF24; border-color:rgba(251,191,36,0.5)">52 · Fair</span>
    <span class="pill" style="background:rgba(248,113,113,0.15); color:#F87171; border-color:rgba(248,113,113,0.5)">Token expired</span>
  </div>
</div>
</body></html>
