<!doctype html>
<html><head><meta charset="utf-8"><title>Neutrals</title>
<link rel="stylesheet" href="_shared.css"></head>
<body>
<div class="card-wrap">
  <div class="row" style="gap:16px; align-items:stretch">
    <div class="swatch" style="flex:1">
      <div class="chip" style="background:#FFFDF5"></div>
      <div><div class="name">Background</div><div class="hex">#FFFDF5 · warm cream</div></div>
    </div>
    <div class="swatch" style="flex:1">
      <div class="chip" style="background:#FFFFFF"></div>
      <div><div class="name">Card</div><div class="hex">#FFFFFF</div></div>
    </div>
    <div class="swatch" style="flex:1">
      <div class="chip" style="background:#F1F5F9"></div>
      <div><div class="name">Muted · Slate 100</div><div class="hex">#F1F5F9</div></div>
    </div>
    <div class="swatch" style="flex:1">
      <div class="chip" style="background:#E2E8F0"></div>
      <div><div class="name">Border · Slate 200</div><div class="hex">#E2E8F0</div></div>
    </div>
    <div class="swatch" style="flex:1">
      <div class="chip" style="background:#64748B"></div>
      <div><div class="name">Muted text · Slate 500</div><div class="hex">#64748B</div></div>
    </div>
    <div class="swatch" style="flex:1">
      <div class="chip" style="background:#1E293B"></div>
      <div><div class="name">Foreground · Slate 800</div><div class="hex">#1E293B · softer than black</div></div>
    </div>
  </div>
</div>
</body></html>
