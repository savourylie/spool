<!doctype html>
<html><head><meta charset="utf-8"><title>Spacing</title>
<link rel="stylesheet" href="_shared.css">
<style>
.stack-row{display:flex;align-items:center;gap:14px}
.step{height:18px;background:#8B5CF6;border-radius:4px}
.tag{font-family:ui-monospace,monospace;font-size:11px;color:var(--muted-foreground);min-width:54px}
</style>
</head>
<body>
<div class="card-wrap">
  <div class="lbl">8-px base grid · spacing scale</div>
  <div class="col" style="gap:10px">
    <div class="stack-row"><span class="tag">4</span><div class="step" style="width:4px"></div></div>
    <div class="stack-row"><span class="tag">8</span><div class="step" style="width:8px"></div></div>
    <div class="stack-row"><span class="tag">12</span><div class="step" style="width:12px"></div></div>
    <div class="stack-row"><span class="tag">16</span><div class="step" style="width:16px"></div></div>
    <div class="stack-row"><span class="tag">24</span><div class="step" style="width:24px"></div></div>
    <div class="stack-row"><span class="tag">32</span><div class="step" style="width:32px"></div></div>
    <div class="stack-row"><span class="tag">48</span><div class="step" style="width:48px"></div></div>
    <div class="stack-row"><span class="tag">64</span><div class="step" style="width:64px"></div></div>
    <div class="stack-row"><span class="tag">96 · py-24</span><div class="step" style="width:96px"></div></div>
  </div>
  <div style="font-family:ui-monospace,monospace;font-size:11px;color:var(--muted-foreground);margin-top:4px">Standard section padding is <strong>py-24 (96px)</strong>. Generous, but never empty — fill with shapes & patterns.</div>
</div>
</body></html>
