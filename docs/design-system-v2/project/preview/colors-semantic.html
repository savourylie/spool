<!doctype html>
<html><head><meta charset="utf-8"><title>Semantic colors</title>
<link rel="stylesheet" href="_shared.css">
<style>
  .demo { padding: 14px 16px; border: 2px solid; border-radius: var(--radius-sm); font-weight: 600; font-size: 14px; }
</style>
</head>
<body>
<div class="card-wrap">
  <div class="row" style="gap:12px; align-items:stretch">
    <div style="flex:1" class="col">
      <div class="lbl">Destructive · #EF4444</div>
      <div class="demo" style="background:#FEF2F2; border-color:#EF4444; color:#EF4444">Token expired — reconnect Threads</div>
    </div>
    <div style="flex:1" class="col">
      <div class="lbl">Warning · Amber (tertiary)</div>
      <div class="demo" style="background:rgba(251,191,36,0.1); border-color:#FBBF24; color:#1E293B">Post more to improve accuracy.</div>
    </div>
  </div>
  <div class="row" style="gap:12px; align-items:stretch; margin-top:4px">
    <div style="flex:1" class="col">
      <div class="lbl">Info · Pink (secondary)</div>
      <div class="demo" style="background:rgba(244,114,182,0.1); border-color:#F472B6; color:#1E293B">You always post Tue 9 AM. Try varying.</div>
    </div>
    <div style="flex:1" class="col">
      <div class="lbl">Success · Mint (quaternary)</div>
      <div class="demo" style="background:rgba(52,211,153,0.1); border-color:#34D399; color:#1E293B">All done — your posts are ready.</div>
    </div>
  </div>
</div>
</body></html>
