<!doctype html>
<html><head><meta charset="utf-8"><title>Radii</title>
<link rel="stylesheet" href="_shared.css">
<style>
.rbox { border:2px solid var(--foreground); background:var(--card); display:flex;align-items:center;justify-content:center; font-family:ui-monospace,monospace; font-size:11px; color:var(--muted-foreground); }
</style>
</head>
<body>
<div class="card-wrap">
  <div class="row" style="gap:14px; align-items:flex-end">
    <div class="col" style="gap:6px;align-items:center">
      <div class="rbox" style="width:90px;height:60px;border-radius:8px">8</div>
      <div style="font-size:11px;font-weight:700">sm · badges</div>
    </div>
    <div class="col" style="gap:6px;align-items:center">
      <div class="rbox" style="width:90px;height:60px;border-radius:16px">16</div>
      <div style="font-size:11px;font-weight:700">md · inputs</div>
    </div>
    <div class="col" style="gap:6px;align-items:center">
      <div class="rbox" style="width:90px;height:60px;border-radius:24px">24</div>
      <div style="font-size:11px;font-weight:700">lg · cards</div>
    </div>
    <div class="col" style="gap:6px;align-items:center">
      <div class="rbox" style="width:120px;height:44px;border-radius:9999px">pill</div>
      <div style="font-size:11px;font-weight:700">full · buttons</div>
    </div>
    <div class="col" style="gap:6px;align-items:center">
      <div class="rbox" style="width:90px;height:60px;border-radius:24px 24px 24px 0">blob</div>
      <div style="font-size:11px;font-weight:700">speech bubble</div>
    </div>
    <div class="col" style="gap:6px;align-items:center">
      <div class="rbox" style="width:90px;height:60px;border-radius:9999px 9999px 0 0">arch</div>
      <div style="font-size:11px;font-weight:700">arch</div>
    </div>
  </div>
  <div class="spec" style="font-family:ui-monospace,monospace;font-size:11px;color:var(--muted-foreground)">All borders default to <strong>2px solid foreground</strong> — chunky, visible, deliberate.</div>
</div>
</body></html>
