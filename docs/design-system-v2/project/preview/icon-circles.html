<!doctype html>
<html><head><meta charset="utf-8"><title>Icon circles</title>
<link rel="stylesheet" href="_shared.css">
</head>
<body>
<div class="card-wrap">
  <div class="row" style="gap:18px;align-items:center">
    <div class="icon-circle bg-accent">
      <svg viewBox="0 0 24 24" fill="currentColor" width="20" height="20"><path d="M3 21h18v-2H3v2zM5 17h2V9H5v8zm4 0h2V5H9v12zm4 0h2v-6h-2v6zm4 0h2V8h-2v9z"/></svg>
    </div>
    <div class="icon-circle bg-secondary">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" width="20" height="20"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
    </div>
    <div class="icon-circle bg-tertiary">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" width="20" height="20"><path d="M17 21v-2a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v2"/><circle cx="10" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M17 3.13a4 4 0 0 1 0 7.75"/></svg>
    </div>
    <div class="icon-circle bg-quaternary">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" width="20" height="20"><path d="M20 6 9 17l-5-5"/></svg>
    </div>
    <div class="icon-circle lg bg-accent">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" width="28" height="28"><path d="m9 11-6 6v3h3l6-6"/><path d="m22 5-3-3-7 7 3 3 7-7Z"/></svg>
    </div>
    <div class="icon-circle sm bg-quaternary">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" width="14" height="14"><path d="M20 6 9 17l-5-5"/></svg>
    </div>
  </div>
  <div style="font-family:ui-monospace,monospace;font-size:11px;color:var(--muted-foreground)">Phosphor icons (weight: fill or regular). <strong>Always enclosed in a colored circle</strong> — never floating alone.</div>
</div>
</body></html>
