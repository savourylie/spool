<!doctype html>
<html><head><meta charset="utf-8"><title>Pop palette</title>
<link rel="stylesheet" href="_shared.css"></head>
<body>
<div class="card-wrap">
  <div class="row" style="gap:16px; align-items:stretch">
    <div class="swatch" style="flex:1">
      <div class="chip" style="background:#8B5CF6"></div>
      <div>
        <div class="name">Accent · Vivid Violet</div>
        <div class="hex">#8B5CF6 — primary actions only</div>
      </div>
    </div>
    <div class="swatch" style="flex:1">
      <div class="chip" style="background:#F472B6"></div>
      <div>
        <div class="name">Secondary · Hot Pink</div>
        <div class="hex">#F472B6 — decorative pop</div>
      </div>
    </div>
    <div class="swatch" style="flex:1">
      <div class="chip" style="background:#FBBF24"></div>
      <div>
        <div class="name">Tertiary · Amber</div>
        <div class="hex">#FBBF24 — decorative pop</div>
      </div>
    </div>
    <div class="swatch" style="flex:1">
      <div class="chip" style="background:#34D399"></div>
      <div>
        <div class="name">Quaternary · Mint</div>
        <div class="hex">#34D399 — decorative pop</div>
      </div>
    </div>
  </div>
</div>
