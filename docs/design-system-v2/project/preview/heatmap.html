<!doctype html>
<html><head><meta charset="utf-8"><title>Heatmap cells</title>
<link rel="stylesheet" href="_shared.css">
<style>
.grid{ display:grid; grid-template-columns: 36px repeat(12, 1fr); gap: 4px; }
.cell{ aspect-ratio: 1/1; border-radius: 6px; display:flex;align-items:center;justify-content:center; font-size:9px; font-weight:700;}
.cell.empty{ border:1.5px dashed var(--border); }
.daylbl{ font-size:11px; font-weight:600; color:var(--muted-foreground); display:flex;align-items:center;justify-content:flex-end;padding-right:4px}
.hourlbl{ font-size:9px; color:var(--muted-foreground); text-align:center}
</style>
</head>
<body>
<div class="card-wrap">
  <div class="grid">
    <div></div>
    <div class="hourlbl">8a</div><div class="hourlbl">9</div><div class="hourlbl">10</div><div class="hourlbl">11</div>
    <div class="hourlbl">12p</div><div class="hourlbl">1</div><div class="hourlbl">2</div><div class="hourlbl">3</div>
    <div class="hourlbl">4</div><div class="hourlbl">5</div><div class="hourlbl">6</div><div class="hourlbl">7p</div>

    <div class="daylbl">Mon</div>
    <div class="cell" style="background:hsl(216,52%,89%)"></div>
    <div class="cell empty"></div>
    <div class="cell" style="background:hsl(231,66%,82%);color:#1E293B">1.4</div>
    <div class="cell empty"></div>
    <div class="cell" style="background:hsl(245,79%,75%);color:#fff">2.0</div>
    <div class="cell empty"></div>
    <div class="cell" style="background:hsl(258,84%,70%);color:#fff">3.1</div>
    <div class="cell empty"></div>
    <div class="cell empty"></div>
    <div class="cell" style="background:hsl(263,90%,66%);color:#fff">4.2</div>
    <div class="cell empty"></div>
    <div class="cell empty"></div>

    <div class="daylbl">Tue</div>
    <div class="cell empty"></div>
    <div class="cell" style="background:hsl(225,60%,85%);color:#1E293B">1.1</div>
    <div class="cell" style="background:hsl(258,84%,70%);color:#fff">3.0</div>
    <div class="cell empty"></div>
    <div class="cell empty"></div>
    <div class="cell" style="background:hsl(263,90%,66%);color:#fff">4.6</div>
    <div class="cell" style="background:hsl(245,79%,75%);color:#fff">2.4</div>
    <div class="cell empty"></div>
    <div class="cell empty"></div>
    <div class="cell empty"></div>
    <div class="cell" style="background:hsl(231,66%,82%);color:#1E293B">1.7</div>
    <div class="cell empty"></div>

    <div class="daylbl">Wed</div>
    <div class="cell empty"></div>
    <div class="cell" style="background:hsl(216,52%,89%)"></div>
    <div class="cell empty"></div>
    <div class="cell" style="background:hsl(245,79%,75%);color:#fff">2.2</div>
    <div class="cell empty"></div>
    <div class="cell empty"></div>
    <div class="cell" style="background:hsl(231,66%,82%);color:#1E293B">1.6</div>
    <div class="cell empty"></div>
    <div class="cell" style="background:hsl(258,84%,70%);color:#fff">3.4</div>
    <div class="cell empty"></div>
    <div class="cell empty"></div>
    <div class="cell" style="background:hsl(263,90%,66%);color:#fff">4.0</div>
  </div>

  <div class="row" style="justify-content:flex-end;gap:8px;font-size:10px;color:var(--muted-foreground)">
    <span>Lower</span>
    <div style="height:8px;width:100px;border-radius:4px;background:linear-gradient(to right, hsl(216,52%,89%), hsl(245,79%,75%), hsl(263,90%,66%))"></div>
    <span>Higher</span>
  </div>
</div>
</body></html>
