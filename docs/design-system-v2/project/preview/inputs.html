<!doctype html>
<html><head><meta charset="utf-8"><title>Inputs</title>
<link rel="stylesheet" href="_shared.css">
<style>
.field{display:flex;flex-direction:column;gap:6px}
.input{
  height:44px; padding:0 14px;
  border:2px solid var(--input-border);
  background: var(--input);
  border-radius: var(--radius-md);
  font-family: var(--font-sans); font-size: 14px; color: var(--foreground);
  outline: none;
}
.input.focus{ border-color: var(--accent); box-shadow: var(--shadow-accent); }
.input::placeholder{ color: var(--muted-foreground); }
.textarea{
  min-height:90px; padding:12px 14px; resize:vertical;
  border:2px solid var(--input-border); background:var(--input);
  border-radius: var(--radius-md); font-family: var(--font-sans); font-size: 14px;
}
</style>
</head>
<body>
<div class="card-wrap">
  <div class="row" style="gap:16px; align-items:flex-start">
    <div class="field" style="flex:1">
      <label class="lbl">Topic</label>
      <input class="input" placeholder="What do you want to post about?" />
    </div>
    <div class="field" style="flex:1">
      <label class="lbl">Email · focused</label>
      <input class="input focus" value="hi@spool.app" />
    </div>
  </div>
  <div class="field">
    <label class="lbl">Draft post</label>
    <div class="textarea">Type or paste a draft post to analyze...</div>
  </div>
</div>
</body></html>
