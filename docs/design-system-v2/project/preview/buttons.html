<!doctype html>
<html><head><meta charset="utf-8"><title>Buttons</title>
<link rel="stylesheet" href="_shared.css">
<style>
  .label-line{display:flex;align-items:center;gap:10px;font-size:11px;color:var(--muted-foreground);font-weight:700;text-transform:uppercase;letter-spacing:0.08em}
  .arrow-svg{width:12px;height:12px}
</style>
</head>
<body>
<div class="card-wrap">
  <div class="row" style="gap:14px">
    <button class="btn">Get Started <span class="iconchip"><svg class="arrow-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></button>
    <button class="btn outline">Try again</button>
    <button class="btn ghost">Sign out</button>
    <button class="btn" style="background:#FEF2F2;border-color:#EF4444;color:#EF4444;box-shadow:none">Disconnect</button>
  </div>
  <div class="row" style="gap:14px">
    <button class="btn sm">Apply rewrite</button>
    <button class="btn">Generate Drafts</button>
    <button class="btn lg">Connect Threads</button>
  </div>
  <div class="label-line">Candy · Outline · Ghost · Destructive — pill, 2px border, hard shadow</div>
</div>
</body></html>
