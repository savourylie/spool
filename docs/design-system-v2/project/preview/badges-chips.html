<!doctype html>
<html><head><meta charset="utf-8"><title>Badges, chips & pills</title>
<link rel="stylesheet" href="_shared.css">
<style>
.pill{
  display:inline-flex; align-items:center; gap:6px;
  height:26px; padding: 0 10px;
  border-radius:9999px; border: 1px solid;
  font-size:11px; font-weight:700;
  font-family: ui-monospace, monospace;
}
.chip-filter{
  display:inline-flex; align-items:center; gap:6px;
  height:34px; padding: 0 12px;
  border-radius:9999px; border: 2px solid var(--foreground);
  background: var(--background); color: var(--foreground);
  font-size:13px; font-weight:700;
}
.chip-filter.active{ background: var(--accent); color: white; box-shadow: var(--shadow-default); }
.chip-active{
  display:inline-flex; align-items:center; gap:6px;
  height:30px; padding:0 10px 0 12px;
  border-radius:9999px; background: var(--muted); color: var(--foreground); font-size:12px; font-weight:600;
}
.chip-active button{
  background:transparent;border:0;cursor:pointer;color:var(--muted-foreground);
  width:18px;height:18px;display:inline-flex;align-items:center;justify-content:center;
}
</style>
</head>
<body>
<div class="card-wrap">
  <div class="lbl">Score pills (quality / WES)</div>
  <div class="row" style="gap:10px">
    <span class="pill" style="background:rgba(239,68,68,0.1);border-color:rgba(239,68,68,0.3);color:#EF4444">28/100</span>
    <span class="pill" style="background:rgba(251,191,36,0.1);border-color:rgba(251,191,36,0.3);color:#B45309">52/100</span>
    <span class="pill" style="background:rgba(52,211,153,0.1);border-color:rgba(52,211,153,0.3);color:#047857">84/100</span>
    <span class="pill" style="background:rgba(139,92,246,0.1);border-color:rgba(139,92,246,0.3);color:#8B5CF6">★ TOP · WES 2.31</span>
  </div>

  <div class="lbl" style="margin-top:8px">Style preset toggles</div>
  <div class="row" style="gap:8px">
    <span class="chip-filter active">Professional</span>
    <span class="chip-filter">Casual</span>
    <span class="chip-filter">Provocative</span>
    <span class="chip-filter">Educational</span>
    <span class="chip-filter">Humorous</span>
  </div>

  <div class="lbl" style="margin-top:8px">Active filter chips</div>
  <div class="row" style="gap:8px">
    <span class="chip-active">Image <button>✕</button></span>
    <span class="chip-active">Video <button>✕</button></span>
    <span class="chip-active">From Mar 1, 2026 <button>✕</button></span>
  </div>
</div>
</body></html>
